name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Bundle & package VSIX
        env:
          # Optional repo secret; without it the build still succeeds, Antigravity login is just disabled.
          A2K_ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.A2K_ANTIGRAVITY_CLIENT_SECRET }}
          # `npm run package` calls `npx @vscode/vsce`; auto-confirm the one-off install in CI.
          npm_config_yes: "true"
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
