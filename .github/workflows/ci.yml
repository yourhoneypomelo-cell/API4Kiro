name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Bundle & package VSIX
        env:
          # Public Release / CI vsix must not embed Antigravity client secret.
          # Do not set A2K_ANTIGRAVITY_CLIENT_SECRET (env or Actions secret).
          # `npm run package` calls `npx @vscode/vsce`; auto-confirm the one-off install in CI.
          npm_config_yes: "true"
        run: npm run package

      - name: Public VSIX must not embed Antigravity client secret
        run: |
          python3 - <<'PY'
          import glob, re, sys, zipfile
          vsix = glob.glob("*.vsix")
          if len(vsix) != 1:
              print("expected one vsix, got", vsix)
              sys.exit(1)
          real = re.compile(rb"GOCSPX-[A-Za-z0-9_-]{10,}")
          hits = []
          with zipfile.ZipFile(vsix[0]) as z:
              for name in z.namelist():
                  if real.search(z.read(name)):
                      hits.append(name)
          if hits:
              print("real GOCSPX- value found in", hits)
              sys.exit(1)
          print("ok: no real GOCSPX- value in", vsix[0])
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
