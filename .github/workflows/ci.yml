name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
# 权限下放到 job：PR / 普通构建只需要读仓库，只有 tag 发布那一步才需要写（附件挂到 Release）。
permissions:
  contents: read
jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run compile
      - name: Unit tests (node --test)
        run: npm test
      # 无真机 Kiro 的合成夹具模式：真机段落打印 SKIP，合成 1.1.x 全链路照跑。
      - name: Verify selector patch (synthetic fixtures)
        run: node dev/verify-selector-patch.js --synthetic
      - name: Verify startup race
        run: node dev/verify-startup-race.js
      # Public Release / CI vsix must not embed Antigravity client secret.
      # Do not set A2K_ANTIGRAVITY_CLIENT_SECRET (env or Actions secret).
      - name: Bundle & package VSIX
        run: npm run package
      - name: Public VSIX must not embed Antigravity client secret
        run: |
          python3 - <<'PY'
          import glob, re, sys, zipfile
          vsix = glob.glob("*.vsix")
          if len(vsix) != 1:
              print("expected one vsix, got", vsix)
              sys.exit(1)
          real = re.compile(rb"GOCSPX-[A-Za-z0-9_-]{10,}")
          hits = []
          with zipfile.ZipFile(vsix[0]) as z:
              for name in z.namelist():
                  if real.search(z.read(name)):
                      hits.append(name)
          if hits:
              print("real GOCSPX- value found in", hits)
              sys.exit(1)
          print("ok: no real GOCSPX- value in", vsix[0])
          PY
      # 上传的产物名显式写出（不再用 *.vsix glob）：release job 要按同一个名字取回来。
      - name: Name the vsix artifact
        id: vsix
        run: echo "file=api2kiro-dual-$(node -p "require('./package.json').version").vsix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.file }}
          if-no-files-found: error

  # 只在 tag 上跑：把 build job 已经打好的**同一个** vsix 取回来，生成 .sha256 并一起挂到 Release。
  # 不重新构建，避免「发布的包和测过的包不是同一份」。
  release:
    name: Attach VSIX to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vsix
      - name: Generate SHA256 checksum
        run: |
          V=$(node -p "require('./package.json').version")
          test "$(ls "api2kiro-dual-${V}.vsix" 2>/dev/null | wc -l | tr -d ' ')" = "1"
          sha256sum "api2kiro-dual-${V}.vsix" > "api2kiro-dual-${V}.vsix.sha256"
          cat "api2kiro-dual-${V}.vsix.sha256"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            api2kiro-dual-*.vsix
            api2kiro-dual-*.vsix.sha256
          generate_release_notes: true
